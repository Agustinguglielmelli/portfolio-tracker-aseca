services:
  test-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    ports:
      - "5433:5432"

  test-python-worker:
    build:
      context: ./python-worker
    ports:
      - "8001:8000"
    env_file:
      - ./python-worker/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@test-db:5432/${POSTGRES_TEST_DB}
    depends_on:
      - test-db
    restart: on-failure
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  test-backend:
    build:
      context: ./back
    ports:
      - "3000:3000"
    env_file:
      - ./back/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@test-db:5432/${POSTGRES_TEST_DB}
      PYTHON_WORKER_URL: http://test-python-worker:8000
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command: sh -c "npx prisma generate && npx prisma db push && npx prisma db seed && npm run start:dev"
    volumes:
      - ./back:/app
      - /app/node_modules
    depends_on:
      test-db:
        condition: service_started
      test-python-worker:
        condition: service_healthy
    restart: on-failure

  test-frontend:
    build:
      context: ./front
    ports:
      - "3001:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - test-backend