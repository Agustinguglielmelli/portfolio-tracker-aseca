# US 3.2 — CI snippet for batch price update
# This workflow can be triggered manually from GitHub Actions to run
# the stock price update batch process inside the Docker environment.
# It supports both full-DB and override-ticker modes via TICKERS_OVERRIDE.
name: Update Stock Prices (Manual)

on:
  workflow_dispatch: # US 3.2 — Manual trigger only
    inputs:
      tickers_override:
        description: |
          Optional comma-separated list of tickers to update (e.g. "AAPL,MSFT").
          Leave empty to update all tickers from the database.
        required: false
        default: ""
      fetch_timeout:
        description: "Per-ticker fetch timeout in seconds (default: 30)"
        required: false
        default: "30"

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # US 3.2 — Start database and backend services
      - name: Start services
        run: docker compose up -d --build db backend

      # US 3.2 — Wait for the database to be ready
      - name: Wait for DB
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            docker compose exec db pg_isready -U postgres && break
            sleep 2
          done

      # US 3.2 — Run Prisma migrations and seed the admin user inside the backend container
      - name: Run migrations and seed
        run: |
          docker compose exec backend npx prisma migrate deploy
          docker compose exec backend npx prisma db seed

      # US 3.2 — Execute the batch price update script via docker-compose exec.
      # ADMIN_API_KEY is stored as a GitHub Actions secret (Settings → Secrets).
      # TICKERS_OVERRIDE and FETCH_TIMEOUT are passed from the workflow_dispatch inputs.
      # The script exits 0 even if individual tickers fail; only a critical error exits 1.
      - name: Run price update batch
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          TICKERS_OVERRIDE: ${{ github.event.inputs.tickers_override }}
          FETCH_TIMEOUT: ${{ github.event.inputs.fetch_timeout }}
        run: |
          docker compose exec \
            -e TICKERS_OVERRIDE="$TICKERS_OVERRIDE" \
            -e FETCH_TIMEOUT="$FETCH_TIMEOUT" \
            backend python3 scripts/update_prices.py

      # US 3.2 — Cleanup
      - name: Stop services
        if: always()
        run: docker compose down
