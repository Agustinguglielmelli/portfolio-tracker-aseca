# CI workflow for the stock price batch update via python-worker (FastAPI microservice)
# Triggered manually from GitHub Actions.
# Supports both full-DB and override-ticker modes via TICKERS_OVERRIDE.
name: Update Stock Prices (Manual)

on:
  workflow_dispatch:
    inputs:
      tickers_override:
        description: |
          Optional comma-separated list of tickers to update (e.g. "AAPL,MSFT").
          Leave empty to update all tickers from the database.
        required: false
        default: ""
      fetch_timeout:
        description: "Per-ticker fetch timeout in seconds (default: 30)"
        required: false
        default: "30"

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Start database, python-worker and backend services
      - name: Start services
        run: docker compose up -d --build db python-worker backend
        env:
          TICKERS_OVERRIDE: ${{ github.event.inputs.tickers_override }}
          FETCH_TIMEOUT: ${{ github.event.inputs.fetch_timeout }}

      # Wait for the database to be ready
      - name: Wait for DB
        run: |
          echo "Waiting for PostgreSQL..."
          for i in $(seq 1 30); do
            docker compose exec db pg_isready -U postgres && break
            sleep 2
          done

      # Wait for the python-worker healthcheck to pass
      - name: Wait for python-worker
        run: |
          echo "Waiting for python-worker..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 3
          done

      # Run Prisma migrations and seed the admin user inside the backend container
      - name: Run migrations and seed
        run: |
          docker compose exec backend npx prisma migrate deploy
          docker compose exec backend npx prisma db seed

      # Trigger the batch update via HTTP POST to the python-worker API.
      # ADMIN_API_KEY is stored as a GitHub Actions secret (Settings → Secrets).
      # The curl call goes through the backend (NestJS) which forwards to python-worker,
      # or directly to python-worker if you prefer to bypass NestJS.
      - name: Trigger price update batch
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          curl -sf -X POST http://localhost:3000/prices/update \
            -H "x-api-key: $ADMIN_API_KEY" \
            -H "Content-Type: application/json"

      # Cleanup
      - name: Stop services
        if: always()
        run: docker compose down
