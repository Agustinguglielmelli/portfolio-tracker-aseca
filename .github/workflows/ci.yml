name: CI - Unit & Integration Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./front

      - name: Build frontend
        run: npm run build
        working-directory: ./front

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_TEST_DB: integration_test_db
      DATABASE_URL: postgresql://postgres:password@localhost:5433/integration_test_db
      JWT_SECRET: test_secret_key
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: back/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./back

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./back

      - name: Run Unit Tests
        run: npm run test
        working-directory: ./back

      - name: Create python-worker env file
        run: touch python-worker/.env

      - name: Start Integration Infrastructure
        run: docker compose -f docker-compose.integration.yml up -d --build --wait

      - name: Setup Integration Database
        run: npm run test:integration:setup
        working-directory: ./back

      - name: Run Integration Tests
        run: npm run test:integration
        working-directory: ./back

      - name: Stop Infrastructure
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  worker-tests:
    name: Python Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python-worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
        working-directory: ./python-worker

      - name: Run pytest
        run: python -m pytest
        working-directory: ./python-worker