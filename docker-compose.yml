services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  python-worker:
    build:
      context: ./python-worker
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TICKERS_OVERRIDE: ${TICKERS_OVERRIDE:-}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-30}
    depends_on:
      - db
    restart: on-failure
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./back
    ports:
      - "3000:3000"
    env_file:
      - ./back/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHON_WORKER_URL: http://python-worker:8000
    command: sh -c "npx prisma generate && npx prisma db push && npx prisma db seed && npm run start:dev"
    volumes:
      - ./back:/app
      - /app/node_modules
    depends_on:
      - db
      - python-worker
    restart: on-failure

  frontend:
    build:
      context: ./front
    ports:
      - "3001:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

  integration-test-db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_TEST_DB}
    ports:
      - "5433:5432"

volumes:
  pgdata: