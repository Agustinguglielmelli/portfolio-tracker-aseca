services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: backend_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./back
    ports:
      - "3000:3000"
    env_file:
      - ./back/.env
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/backend_db
    command: sh -c "npx prisma generate && npx prisma db push && npm run start:dev"
    volumes:
      - ./back:/app
      - /app/node_modules
    depends_on:
      - db
    restart: on-failure

  frontend:
    build:
      context: ./front
    ports:
      - "3001:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

volumes:
  pgdata: